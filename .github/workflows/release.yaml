name: Release

on:
  push:
    branches: [ main ]
    paths:
      - "versions.txt"
  workflow_dispatch:

env:
  IMAGE: nesvet/mongo-rs

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build }}
      merge_matrix: ${{ steps.matrix.outputs.merge }}
    steps:
      - uses: actions/checkout@v6
      - id: matrix
        run: |
          build_matrix=$(python3 -c "
          import json
          versions = [v.strip() for v in open('versions.txt') if v.strip()]
          include = []
          for v in versions:
            for platform, slug, runner in [('linux/amd64','linux-amd64','ubuntu-latest'), ('linux/arm64','linux-arm64','ubuntu-24.04-arm')]:
              include.append({'version':v,'platform':platform,'platform_slug':slug,'runner':runner})
          print(json.dumps({'include':include}))
          ")
          merge_matrix=$(python3 -c "
          import json
          versions = [v.strip() for v in open('versions.txt') if v.strip()]
          include = [{'version':v,'latest':(i==len(versions)-1)} for i,v in enumerate(versions)]
          print(json.dumps({'include':include}))
          ")
          echo "build<<BUILD_EOF" >> $GITHUB_OUTPUT
          echo "$build_matrix" >> $GITHUB_OUTPUT
          echo "BUILD_EOF" >> $GITHUB_OUTPUT
          echo "merge<<MERGE_EOF" >> $GITHUB_OUTPUT
          echo "$merge_matrix" >> $GITHUB_OUTPUT
          echo "MERGE_EOF" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            MONGO_VERSION=${{ matrix.version }}
          outputs: |
            type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.version }}-${{ matrix.platform_slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [ prepare, build ]
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.merge_matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.version }}-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          v="${{ matrix.version }}"
          mj=$(echo "$v" | cut -d. -f1,2)
          ma=$(echo "$v" | cut -d. -f1)
          tags="-t ${{ env.IMAGE }}:$ma -t ${{ env.IMAGE }}:$mj -t ${{ env.IMAGE }}:$v"
          [ "${{ matrix.latest }}" = "true" ] && tags="$tags -t ${{ env.IMAGE }}:latest"
          digest_refs=$(printf "${{ env.IMAGE }}@sha256:%s " *)
          docker buildx imagetools create $tags $digest_refs
