name: Release

on:
  push:
    branches: [ main ]
    paths:
      - "versions.txt"
  workflow_dispatch:

env:
  IMAGE: nesvet/mongo-rs

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build }}
    steps:
      - uses: actions/checkout@v6
      - id: matrix
        run: |
          build_matrix=$(python3 -c "
          import json
          versions = [v.strip() for v in open('versions.txt') if v.strip()]
          include = [
              {'version': v, 'platform': p, 'platform_slug': s, 'runner': r}
              for v in versions
              for p, s, r in [('linux/amd64', 'linux-amd64', 'ubuntu-latest'), ('linux/arm64', 'linux-arm64', 'ubuntu-24.04-arm')]
          ]
          print(json.dumps({'include': include}))
          ")
          echo "build<<BUILD_EOF" >> $GITHUB_OUTPUT
          echo "$build_matrix" >> $GITHUB_OUTPUT
          echo "BUILD_EOF" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            MONGO_VERSION=${{ matrix.version }}
          cache-from: type=gha,scope=mongo-rs
          cache-to: type=gha,mode=max,scope=mongo-rs
          outputs: |
            type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests/${{ matrix.version }}"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${{ matrix.version }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.version }}-${{ matrix.platform_slug }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifests and push
        run: |
          versions_file="${{ github.workspace }}/versions.txt"
          last_version=$(grep -v '^[[:space:]]*$' "$versions_file" | tail -1 | xargs)
          cd "${{ runner.temp }}/digests"
          while IFS= read -r version || [ -n "$version" ]; do
            version=$(echo "$version" | xargs)
            [ -z "$version" ] && continue
            [ ! -d "$version" ] && continue
            mj=$(echo "$version" | cut -d. -f1,2)
            ma=$(echo "$version" | cut -d. -f1)
            tags="-t ${{ env.IMAGE }}:$ma -t ${{ env.IMAGE }}:$mj -t ${{ env.IMAGE }}:$version"
            [ "$version" = "$last_version" ] && tags="$tags -t ${{ env.IMAGE }}:latest"
            digest_refs=$(for f in "$version"/*; do echo -n "${{ env.IMAGE }}@sha256:$(basename "$f") "; done)
            docker buildx imagetools create $tags $digest_refs
          done < "$versions_file"
